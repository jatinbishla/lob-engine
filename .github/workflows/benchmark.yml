name: Benchmark
# Manually triggered — produces the canonical single-machine benchmark numbers
# (Linux x86, Release, core-pinned) and uploads them for the README/BENCHMARKS.md.
on:
  workflow_dispatch:

# The commit-back step needs push access; artifact upload does not.
permissions:
  contents: write

jobs:
  benchmark:
    name: latency + throughput (Linux x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      # Baseline A/B: two builds of the same bench, pool on vs off, so the pool's
      # effect on the tail is measured on identical infrastructure.
      - name: Configure + build (object pool ON)
        run: |
          cmake -B build-pool -DCMAKE_BUILD_TYPE=Release -DLOB_BUILD_PYTHON=OFF
          cmake --build build-pool -j"$(nproc)"

      - name: Configure + build (object pool OFF, system allocator)
        run: |
          cmake -B build-nopool -DCMAKE_BUILD_TYPE=Release -DLOB_BUILD_PYTHON=OFF -DLOB_NO_POOL=ON
          cmake --build build-nopool -j"$(nproc)"

      - name: Run — pool OFF (baseline), pinned to core 1
        run: taskset -c 1 ./build-nopool/bench 2>&1 | tee bench_output_nopool.txt

      - name: Run — pool ON (canonical), pinned to core 1
        # Runs last so data/latency_samples.csv holds the pooled samples the chart uses.
        run: taskset -c 1 ./build-pool/bench 2>&1 | tee bench_output_pool.txt

      - name: Install Python plotting deps
        run: sudo apt-get install -y python3-matplotlib python3-numpy python3-pandas

      - name: Regenerate charts from the (pooled) samples
        run: python3 python/make_charts.py

      - name: Write results into README.md + BENCHMARKS.md
        run: python3 python/update_readme.py bench_output_pool.txt bench_output_nopool.txt

      # Upload BEFORE committing so results are inspectable even if the commit is a no-op.
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            images/latency_hist.png
            bench_output_pool.txt
            bench_output_nopool.txt
            data/latency_samples.csv
            README.md
            BENCHMARKS.md

      - name: Commit results back to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md BENCHMARKS.md images/*.png
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "perf: update benchmark results and charts [skip ci]"
            git push
          fi
